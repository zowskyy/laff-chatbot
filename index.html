<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no><meta name=theme-color content=#000000><meta name=apple-mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-status-bar-style content=black-translucent><title>laff</title><link rel=icon type=image/png sizes=192x192 href=/icon-192.png><link rel=icon type=image/png sizes=512x512 href=/icon-512.png><link rel=apple-touch-icon href=/icon-192.png><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden;touch-action:manipulation}#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6vh 5vw 0;position:relative}.title-wrap{text-align:center;width:100%;max-width:420px;margin-bottom:9vh;position:relative;user-select:none}.title-line{position:relative;font-size:clamp(1.8rem,6.5vw,2.6rem);font-weight:400;line-height:1.15;letter-spacing:-0.02em;color:#fff}.title-line .crossed{position:relative;color:#fff;display:inline-block}.title-line .crossed::after{content:'';position:absolute;left:-4%;top:52%;width:108%;height:3px;background:#bbb;transform:rotate(-8deg);border-radius:2px}.title-line .laff{color:#999;font-family:'Brush Script MT','Segoe Script',cursive;font-weight:700;font-size:2.4em;position:absolute;left:50%;top:32%;z-index:5;display:inline-block;transform:scaleY(-1) rotate(10deg) skewX(-8deg);text-shadow:0 0 12px rgba(200,200,200,0.5)}.card-wrap{width:100%;max-width:190px;flex:0 1 42vh;position:relative;display:flex;flex-direction:column;min-height:0}.glow{position:absolute;left:50%;top:50%;width:220%;height:190%;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(255,255,255,0.75) 0%,rgba(255,255,255,0.4) 25%,rgba(255,255,255,0.15) 45%,rgba(255,255,255,0.04) 65%,rgba(255,255,255,0) 80%);filter:blur(55px);pointer-events:none}.chat-container{width:100%;flex:1;display:flex;flex-direction:column;background:#4a4a4a;border:6px solid #666;border-radius:14px;position:relative;overflow:visible;min-height:0}.messages{flex:1;overflow:hidden;padding:18px 16px 40px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}.msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:0.95rem;line-height:1.4;word-wrap:break-word;animation:popIn 0.25s ease-out;position:relative}.msg.their{align-self:flex-start;background:#2a2a2a;color:#e0e0e0;border-bottom-left-radius:4px}.msg.mine{align-self:flex-end;background:#666;color:#fff;border-bottom-right-radius:4px}.msg .meta{font-size:0.65rem;opacity:0.5;margin-top:4px;text-align:right}.typing{align-self:flex-start;background:#2a2a2a;padding:12px 16px;border-radius:14px;border-bottom-left-radius:4px;display:none;gap:4px}.typing.active{display:flex}.typing span{width:5px;height:5px;border-radius:50%;background:#888;animation:pulse 1.2s infinite}.typing span:nth-child(2){animation-delay:0.2s}.typing span:nth-child(3){animation-delay:0.4s}.input-wrap{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);width:88%;display:flex;align-items:center;justify-content:center;padding:16px 18px;background:#0a0a0a;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,0.6)}.input-wrap input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:0.95rem;text-align:center;padding:4px}.input-wrap input::placeholder{color:#777;font-size:0.85rem}.empty-state{text-align:center;color:#666;padding:40px 20px;font-size:0.9rem;line-height:1.6}.connection-status{position:absolute;top:8px;right:12px;font-size:0.65rem;color:#666;z-index:10;display:flex;align-items:center;gap:5px}.connection-status .dot{width:6px;height:6px;border-radius:50%;background:#444}.connection-status.online .dot{background:#eee}.connection-status.offline .dot{background:#555}.admin-badge{position:absolute;top:8px;left:12px;font-size:0.6rem;color:#bbb;text-transform:uppercase;letter-spacing:0.1em;opacity:0;transition:opacity 0.3s}.admin-badge.visible{opacity:1}@keyframes popIn{from{opacity:0;transform:scale(0.9) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}@keyframes pulse{0%,100%{opacity:0.5}50%{opacity:1}}#admin-toggle{position:fixed;top:0;left:0;width:100%;height:12vh;z-index:100;opacity:0;cursor:default}.admin-login{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:200;padding:20px}.admin-login.active{display:flex}.admin-login h2{font-weight:400;margin-bottom:24px;font-size:1.3rem}.admin-login input{background:#1a1a1a;border:1px solid #333;color:#fff;padding:12px 16px;border-radius:8px;font-size:1rem;width:260px;text-align:center;margin-bottom:12px;outline:none}.admin-login button{background:#666;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:0.95rem;cursor:pointer}.admin-login .back{color:#666;margin-top:16px;font-size:0.85rem;cursor:pointer}.convo-list{position:fixed;inset:0;background:#000;z-index:150;display:none;flex-direction:column}.convo-list.active{display:flex}.convo-list header{padding:16px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between}.convo-list header h3{font-weight:400;font-size:1.1rem}.convo-list header .close-btn{background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer}.convo-items{flex:1;overflow-y:auto;padding:8px}.convo-item{padding:14px 16px;border-bottom:1px solid #1a1a1a;cursor:pointer;transition:background 0.15s}.convo-item:hover{background:#111}.convo-item .preview{color:#888;font-size:0.85rem;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.convo-item .time{font-size:0.7rem;color:#555;margin-top:2px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:20px;font-size:0.85rem;opacity:0;transition:all 0.3s;z-index:300;border:1px solid #333}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}</style></head><body><div id=admin-toggle></div><div id=app><div class=title-wrap><div class=title-line>let me tell you</div><div class=title-line>how you should <span class=crossed>feel</span><span class=laff>feel</span></div></div><div class=card-wrap><div class=glow></div><div class=chat-container><div class=connection-status id=connStatus><span class=dot></span></div><div class=admin-badge id=adminBadge>Admin Mode</div><div class=messages id=messages><div class=empty-state id=emptyState></div></div><div class=typing id=typing><span></span><span></span><span></span></div><div class=input-wrap><input id=input autocomplete=off spellcheck=false></div></div></div></div><div class=admin-login id=adminLogin><h2>enter passcode</h2><input type=password id=adminPass placeholder=•••••• autocomplete=off><button id=adminSubmit>unlock</button><div class=back id=adminBack>← back to chat</div></div><div class=convo-list id=convoList><header><h3>conversations</h3><button class=close-btn id=closeConvo>×</button></header><div class=convo-items id=convoItems></div></div><div class=toast id=toast></div><script>(function(){const $=id=>document.getElementById(id);const messages=$('messages'),input=$('input'),typing=$('typing'),emptyState=$('emptyState'),connStatus=$('connStatus'),adminBadge=$('adminBadge'),adminToggle=$('admin-toggle'),adminLogin=$('adminLogin'),adminPass=$('adminPass'),adminSubmit=$('adminSubmit'),adminBack=$('adminBack'),convoList=$('convoList'),convoItems=$('convoItems'),closeConvo=$('closeConvo'),toast=$('toast');let isAdmin=false,currentConvo='public',conversations={},passcode='laff1827';try{const saved=localStorage.getItem('laff_convos');if(saved)conversations=JSON.parse(saved)}catch(e){}function save(){try{localStorage.setItem('laff_convos',JSON.stringify(conversations))}catch(e){}}function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2500)}function addMsg(text,fromMe=false,convo='public'){if(!conversations[convo])conversations[convo]={msgs:[],unread:0,last:Date.now()};const msg={text,fromMe,time:Date.now()};conversations[convo].msgs.push(msg);if(conversations[convo].msgs.length>MAX_VISIBLE)conversations[convo].msgs=conversations[convo].msgs.slice(-MAX_VISIBLE);conversations[convo].last=Date.now();if(!fromMe&&convo!==currentConvo)conversations[convo].unread++;save();if(convo===currentConvo||isAdmin&&convo!=='public')render();if(!fromMe&&convo===currentConvo){typing.classList.remove('active')}}const MAX_VISIBLE=5;function render(){const convo=conversations[currentConvo];if(!convo||convo.msgs.length===0){emptyState.style.display='block';messages.innerHTML='';messages.appendChild(emptyState);return}emptyState.style.display='none';messages.innerHTML='';convo.msgs.slice(-MAX_VISIBLE).forEach(m=>{const div=document.createElement('div');div.className='msg '+(m.fromMe?'mine':'their');div.innerHTML=escapeHtml(m.text)+(isAdmin?`<div class=meta>${fmtTime(m.time)}</div>`:'');messages.appendChild(div)})}function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}function fmtTime(ts){const d=new Date(ts);return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}function send(){const text=input.value.trim();if(!text)return;input.value='';addMsg(text,true,currentConvo);if(!isAdmin){typing.classList.add('active');setTimeout(()=>{typing.classList.remove('active');const replies=[`i hear you.`,`tell me more.`,`that stays between us.`,`i've felt that too.`,`keep going.`,`you're safe here.`];const r=replies[Math.floor(Math.random()*replies.length)];addMsg(r,false,'public')},1200+Math.random()*1500)}}input.addEventListener('keypress',e=>{if(e.key==='Enter')send()});let tapCount=0,tapTimer;adminToggle.addEventListener('click',()=>{tapCount++;clearTimeout(tapTimer);tapTimer=setTimeout(()=>tapCount=0,600);if(tapCount>=4){tapCount=0;adminLogin.classList.add('active')}});adminBack.addEventListener('click',()=>adminLogin.classList.remove('active'));adminSubmit.addEventListener('click',()=>{if(adminPass.value===passcode){isAdmin=true;adminLogin.classList.remove('active');adminBadge.classList.add('visible');showToast('admin mode active');renderConvoList();convoList.classList.add('active')}else{showToast('wrong passcode');adminPass.value=''}});adminPass.addEventListener('keypress',e=>{if(e.key==='Enter')adminSubmit.click()});function renderConvoList(){convoItems.innerHTML='';const ids=Object.keys(conversations).sort((a,b)=>conversations[b].last-conversations[a].last);if(ids.length===0){convoItems.innerHTML='<div style=padding:40px;text-align:center;color:#555>no messages yet</div>';return}ids.forEach(id=>{const c=conversations[id];const div=document.createElement('div');div.className='convo-item';const lastMsg=c.msgs[c.msgs.length-1];const preview=lastMsg?lastMsg.text:'no messages';div.innerHTML=`<div style=display:flex;justify-content:space-between;align-items:center><strong>${id==='public'?'Anonymous User':id.slice(0,8)}</strong>${c.unread?`<span style=background:#666;color:#fff;font-size:0.65rem;padding:2px 8px;border-radius:10px>${c.unread}</span>`:''}</div><div class=preview>${escapeHtml(preview)}</div><div class=time>${fmtTime(c.last)}</div>`;div.addEventListener('click',()=>{currentConvo=id;c.unread=0;save();convoList.classList.remove('active');render();showToast(`switched to ${id==='public'?'anonymous user':id.slice(0,8)}`)});convoItems.appendChild(div)})}closeConvo.addEventListener('click',()=>convoList.classList.remove('active'));setTimeout(()=>{connStatus.classList.add('online')},800);window.addEventListener('beforeunload',save);render()})();</script></body></html>
