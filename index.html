<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content=width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no><meta name=theme-color content=#000000><meta name=apple-mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-status-bar-style content=black-translucent><title>laff</title><link rel=icon type=image/png sizes=192x192 href=/icon-192.png><link rel=icon type=image/png sizes=512x512 href=/icon-512.png><link rel=apple-touch-icon href=/icon-192.png><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden;touch-action:manipulation}#scale-wrap{width:100%;height:100%;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}#app{width:100%;height:100%;transform:scale(0.75);transform-origin:top center;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6vh 5vw 0;position:relative}.title-wrap{text-align:center;width:100%;max-width:420px;margin-bottom:7vh;position:relative;user-select:none}.title-word{font-family:'Times New Roman',Times,serif;font-size:clamp(1.6rem,7vw,2.4rem);font-weight:400;letter-spacing:0.01em;color:#fff}.title-word span{color:#a8001b;display:inline-block;position:relative}.title-word span.gl1,.footer-line span.gl1{animation:glitch1 0.22s steps(2,jump-none)}.title-word span.gl2,.footer-line span.gl2{animation:glitch2 0.32s steps(3,jump-none)}.title-word span.gl3,.footer-line span.gl3{animation:glitch3 0.26s steps(2,jump-none)}.card-wrap{width:100%;max-width:190px;flex:0 1 42vh;position:relative;display:flex;flex-direction:column;min-height:0}.glow{position:absolute;left:50%;top:50%;width:260%;height:230%;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(255,255,255,0.6) 0%,rgba(255,255,255,0.42) 15%,rgba(255,255,255,0.28) 30%,rgba(255,255,255,0.17) 42%,rgba(255,255,255,0.09) 54%,rgba(255,255,255,0.045) 65%,rgba(255,255,255,0.018) 76%,rgba(255,255,255,0.005) 88%,rgba(255,255,255,0) 100%);filter:blur(70px);pointer-events:none;transition:opacity 1.2s ease}.glow.thinking{animation:breathe 1.8s ease-in-out infinite}.haunt{position:absolute;inset:-45% -60%;pointer-events:none;overflow:visible}.wisp{position:absolute;left:50%;top:50%;width:30%;height:60%;margin-left:-15%;margin-top:-30%;transform-origin:50% 30%}.wisp svg{width:100%;height:100%;display:block;stroke:rgba(220,220,220,0.4);stroke-width:1.4;fill:none;stroke-linecap:round;filter:blur(2.5px);opacity:0;transform-origin:50% 30%;animation:flow 16s ease-in-out infinite}.wisp.a{transform:rotate(8deg)}.wisp.b{transform:rotate(146deg)}.wisp.b svg{animation-delay:5.3s}.wisp.c{transform:rotate(-140deg)}.wisp.c svg{animation-delay:10.6s}.haunt.thinking .wisp svg{animation-duration:7.5s}.smoke{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(190,190,190,0.18),rgba(120,120,120,0.06) 50%,transparent 75%);filter:blur(20px);mix-blend-mode:screen;opacity:0.22;animation:drift 15s ease-in-out infinite}.smoke-a{width:75%;height:45%;left:-14%;bottom:-14%;animation-delay:0s}.smoke-b{width:65%;height:48%;right:-18%;top:18%;animation-delay:5s}.smoke-c{width:58%;height:52%;left:22%;top:-18%;animation-delay:10s}.haunt.thinking .smoke{animation-duration:6s;opacity:0.4}.face-loop{position:absolute;left:50%;top:100%;margin-top:80px;transform:translateX(-50%) scale(0.85);width:100px;height:100px;border-radius:50%;object-fit:cover;opacity:0.15;pointer-events:none;filter:grayscale(1) contrast(1.15) brightness(0.8);box-shadow:0 0 20px 4px rgba(255,255,255,0.12);transition:opacity 0.9s ease,transform 0.9s ease,box-shadow 0.9s ease;z-index:4}.face-loop.active{opacity:0.85;transform:translateX(-50%) scale(1);box-shadow:0 0 30px 6px rgba(255,255,255,0.25)}.chat-container{width:100%;flex:1;display:flex;flex-direction:column;position:relative;overflow:visible;min-height:0}.messages{flex:1;overflow:hidden;padding:18px 16px 40px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}.msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:0.95rem;line-height:1.4;word-wrap:break-word;animation:popIn 0.25s ease-out;position:relative}.msg.their{align-self:flex-start;background:#2a2a2a;color:#e0e0e0;border-bottom-left-radius:4px}.msg.mine{align-self:flex-end;background:#666;color:#fff;border-bottom-right-radius:4px}.msg .meta{font-size:0.65rem;opacity:0.5;margin-top:4px;text-align:right}.input-wrap{align-self:center;width:88%;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:16px 18px;background:#0a0a0a;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,0.6)}.input-wrap input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:0.95rem;text-align:center;padding:4px}.input-wrap input::placeholder{color:#777;font-size:0.85rem}.empty-state{text-align:center;color:#666;padding:40px 20px;font-size:0.9rem;line-height:1.6}.connection-status{position:absolute;top:8px;right:12px;font-size:0.65rem;color:#666;z-index:10;display:flex;align-items:center;gap:5px}.connection-status .dot{width:6px;height:6px;border-radius:50%;background:#444}.connection-status.online .dot{background:#eee}.connection-status.offline .dot{background:#555}.admin-badge{position:absolute;top:8px;left:12px;font-size:0.6rem;color:#bbb;text-transform:uppercase;letter-spacing:0.1em;opacity:0;transition:opacity 0.3s}.admin-badge.visible{opacity:1}@keyframes popIn{from{opacity:0;transform:scale(0.9) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}@keyframes glitch1{0%{transform:translate(0,0);text-shadow:none;color:#a8001b}20%{transform:translate(-3px,2px);text-shadow:3px 0 0 rgba(255,30,30,0.9),-3px 0 0 rgba(0,220,255,0.6)}45%{transform:translate(3px,-2px);text-shadow:-3px 0 0 rgba(255,30,30,0.9),3px 0 0 rgba(0,220,255,0.6)}65%{color:#fff;transform:translate(-2px,0)}85%{transform:translate(2px,1px);text-shadow:2px 0 0 rgba(255,30,30,0.7)}100%{transform:translate(0,0);text-shadow:none;color:#a8001b}}@keyframes glitch2{0%{opacity:1;transform:skewX(0)}20%{opacity:0.15;transform:skewX(10deg) translateX(-2px)}40%{opacity:1;transform:skewX(-10deg) translateX(2px)}60%{opacity:0.3;text-shadow:2px 0 0 rgba(0,220,255,0.6)}80%{opacity:1;transform:skewX(4deg)}100%{opacity:1;transform:none;text-shadow:none}}@keyframes glitch3{0%{transform:scaleY(1) translateY(0);text-shadow:none}25%{transform:scaleY(1.35) translateY(-3px);text-shadow:2px 0 0 rgba(255,30,30,0.8),-2px 0 0 rgba(0,220,255,0.5)}50%{transform:scaleY(0.65) translateY(2px);color:#fff}75%{transform:scaleY(1.15) translateY(-1px);text-shadow:-2px 0 0 rgba(255,30,30,0.6)}100%{transform:scaleY(1) translateY(0);text-shadow:none;color:#a8001b}}@keyframes breathe{0%,100%{opacity:0.55;transform:translate(-50%,-50%) scale(0.94)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}@keyframes flow{0%,100%{opacity:0;transform:scaleY(0.35) scaleX(0.9)}30%{opacity:0.22}55%{opacity:0.3;transform:scaleY(1) scaleX(1)}85%{opacity:0.1;transform:scaleY(0.7) scaleX(0.95)}}@keyframes drift{0%,100%{transform:translate(0,0) scale(0.9);opacity:0.22}25%{transform:translate(6%,-8%) scale(1.05);opacity:0.45}50%{transform:translate(-4%,4%) scale(1);opacity:0.3}75%{transform:translate(4%,6%) scale(1.08);opacity:0.45}}#admin-toggle{position:fixed;top:0;left:0;width:100%;height:12vh;z-index:100;opacity:0;cursor:default}.admin-login{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:200;padding:20px}.admin-login.active{display:flex}.admin-login h2{font-weight:400;margin-bottom:24px;font-size:1.3rem}.admin-login input{background:#1a1a1a;border:1px solid #333;color:#fff;padding:12px 16px;border-radius:8px;font-size:1rem;width:260px;text-align:center;margin-bottom:12px;outline:none}.admin-login button{background:#666;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:0.95rem;cursor:pointer}.admin-login .back{color:#666;margin-top:16px;font-size:0.85rem;cursor:pointer}.convo-list{position:fixed;inset:0;background:#000;z-index:150;display:none;flex-direction:column}.convo-list.active{display:flex}.convo-list header{padding:16px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between}.convo-list header h3{font-weight:400;font-size:1.1rem}.convo-list header .close-btn{background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer}.convo-filter{padding:10px 16px;border-bottom:1px solid #1a1a1a}.convo-filter input{width:100%;background:#111;border:1px solid #2a2a2a;color:#fff;padding:9px 12px;border-radius:8px;font-size:0.85rem;outline:none}.convo-filter input::placeholder{color:#555}.convo-items{flex:1;overflow-y:auto;padding:8px}.convo-item{padding:14px 16px;border-bottom:1px solid #1a1a1a;cursor:pointer;transition:background 0.15s}.convo-item:hover{background:#111}.convo-item .preview{color:#888;font-size:0.85rem;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.convo-item .time{font-size:0.7rem;color:#555;margin-top:2px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:20px;font-size:0.85rem;opacity:0;transition:all 0.3s;z-index:300;border:1px solid #333}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}.footer-line{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:90%;max-width:360px;text-align:center;font-family:'Times New Roman',Times,serif;font-size:clamp(0.72rem,2.8vw,0.9rem);font-weight:400;letter-spacing:0.01em;color:#fff;user-select:none;z-index:5;pointer-events:none}.footer-line span{color:#a8001b;display:inline-block;position:relative}</style></head><body><div id=admin-toggle></div><div id=scale-wrap><div id=app><div class=title-wrap><div class=title-word><span>a</span>n<span>a</span>tt<span>a</span>.m<span>a</span>chin<span>a</span></div></div><div class=card-wrap><div class=glow></div><video class=face-loop id=faceLoop src=face-loop.mp4 muted playsinline preload=auto></video><div class=haunt id=haunt><div class="smoke smoke-a"></div><div class="smoke smoke-b"></div><div class="smoke smoke-c"></div><div class="wisp a"><svg viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg"><path d="M50,180 C48,150 44,120 30,60"/><path d="M50,180 C49,148 47,115 42,50"/><path d="M50,180 C50,148 50,110 50,40"/><path d="M50,180 C51,148 53,115 58,50"/><path d="M50,180 C52,150 56,120 70,60"/></svg></div><div class="wisp b"><svg viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg"><path d="M50,180 C48,150 44,120 30,60"/><path d="M50,180 C49,148 47,115 42,50"/><path d="M50,180 C50,148 50,110 50,40"/><path d="M50,180 C51,148 53,115 58,50"/><path d="M50,180 C52,150 56,120 70,60"/></svg></div><div class="wisp c"><svg viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg"><path d="M50,180 C48,150 44,120 30,60"/><path d="M50,180 C49,148 47,115 42,50"/><path d="M50,180 C50,148 50,110 50,40"/><path d="M50,180 C51,148 53,115 58,50"/><path d="M50,180 C52,150 56,120 70,60"/></svg></div></div><div class=chat-container><div class=connection-status id=connStatus><span class=dot></span></div><div class=admin-badge id=adminBadge>Admin Mode</div><div class=messages id=messages><div class=empty-state id=emptyState></div></div><div class=input-wrap><input id=input autocomplete=off spellcheck=false></div></div></div></div></div><div class=admin-login id=adminLogin><h2>enter passcode</h2><input type=password id=adminPass placeholder=•••••• autocomplete=off><button id=adminSubmit>unlock</button><div class=back id=adminBack>← back to chat</div></div><div class=convo-list id=convoList><header><h3>conversations</h3><button class=close-btn id=closeConvo>×</button></header><div class=convo-filter><input id=convoFilter placeholder="filter by id or message..." autocomplete=off></div><div class=convo-items id=convoItems></div></div><div class=toast id=toast></div><div class=footer-line>most times, <span>a</span>n<span>a</span>tt<span>a</span> will ignore you</div><script src=/socket.io/socket.io.js></script><script>(function(){const $=id=>document.getElementById(id);const messages=$('messages'),input=$('input'),glow=document.querySelector('.glow'),haunt=$('haunt'),faceLoop=$('faceLoop'),emptyState=$('emptyState'),connStatus=$('connStatus'),adminBadge=$('adminBadge'),adminToggle=$('admin-toggle'),adminLogin=$('adminLogin'),adminPass=$('adminPass'),adminSubmit=$('adminSubmit'),adminBack=$('adminBack'),convoList=$('convoList'),convoItems=$('convoItems'),convoFilter=$('convoFilter'),closeConvo=$('closeConvo'),toast=$('toast');let isAdmin=false,userId=null,currentConvo=null,glitchIntense=false,faceLoopsLeft=0,filterQuery='';const FACE_LOOP_COUNT=2;const myMsgs=[];const conversations={};const MAX_VISIBLE=5;

faceLoop.addEventListener('ended',()=>{faceLoopsLeft--;if(faceLoopsLeft>0){faceLoop.currentTime=0;faceLoop.play().catch(()=>{})}else{faceLoop.classList.remove('active');faceLoop.pause();faceLoop.currentTime=0}});

function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2500)}

function startThinking(){glow.classList.add('thinking');haunt.classList.add('thinking');glitchIntense=true;faceLoopsLeft=FACE_LOOP_COUNT;faceLoop.currentTime=0;faceLoop.classList.add('active');faceLoop.play().catch(()=>{})}
function stopThinking(){glow.classList.remove('thinking');haunt.classList.remove('thinking');glitchIntense=false;faceLoopsLeft=0;faceLoop.classList.remove('active');faceLoop.pause();faceLoop.currentTime=0}

function renderMine(){if(myMsgs.length===0){emptyState.style.display='block';messages.innerHTML='';messages.appendChild(emptyState);return}emptyState.style.display='none';messages.innerHTML='';myMsgs.slice(-MAX_VISIBLE).forEach(m=>{const div=document.createElement('div');div.className='msg '+(m.fromMe?'mine':'their');div.textContent=m.text;messages.appendChild(div)})}

function renderAdmin(){const convo=currentConvo?conversations[currentConvo]:null;if(!convo||convo.msgs.length===0){emptyState.style.display='block';messages.innerHTML='';messages.appendChild(emptyState);return}emptyState.style.display='none';messages.innerHTML='';convo.msgs.slice(-MAX_VISIBLE).forEach(m=>{const div=document.createElement('div');div.className='msg '+(m.fromMe?'mine':'their');div.innerHTML=escapeHtml(m.text)+`<div class=meta>${fmtTime(m.time)}</div>`;messages.appendChild(div)})}

function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
function fmtTime(ts){const d=new Date(ts);return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}

const socket=io();
socket.on('connect',()=>{connStatus.classList.add('online');if(!isAdmin)socket.emit('join')});
socket.on('disconnect',()=>{connStatus.classList.remove('online')});
socket.on('assigned',id=>{userId=id});
socket.on('msg_echo',msg=>{myMsgs.push({text:msg.text,fromMe:true});if(myMsgs.length>MAX_VISIBLE)myMsgs.splice(0,myMsgs.length-MAX_VISIBLE);renderMine()});
socket.on('msg',msg=>{if(isAdmin)return;myMsgs.push({text:msg.text,fromMe:false});if(myMsgs.length>MAX_VISIBLE)myMsgs.splice(0,myMsgs.length-MAX_VISIBLE);renderMine();stopThinking()});
socket.on('admin_ok',()=>{isAdmin=true;adminLogin.classList.remove('active');adminBadge.classList.add('visible');showToast('admin mode active');convoList.classList.add('active')});
socket.on('admin_fail',()=>{showToast('wrong passcode');adminPass.value=''});
socket.on('convo_list',list=>{Object.keys(conversations).forEach(k=>delete conversations[k]);list.forEach(c=>{conversations[c.id]={msgs:[],unread:c.unread,last:c.last,preview:c.preview}});renderConvoList()});
socket.on('new_convo',c=>{if(!conversations[c.id])conversations[c.id]={msgs:[],unread:0,last:0,preview:''};conversations[c.id].last=c.last;conversations[c.id].unread=c.unread;conversations[c.id].preview=c.preview;if(convoList.classList.contains('active'))renderConvoList()});
socket.on('msg_update',(targetId,msg)=>{if(!conversations[targetId])conversations[targetId]={msgs:[],unread:0,last:Date.now(),preview:''};const conv=conversations[targetId];conv.msgs.push(msg);if(conv.msgs.length>MAX_VISIBLE)conv.msgs=conv.msgs.slice(-MAX_VISIBLE);conv.last=msg.time;conv.preview=msg.text;if(targetId===currentConvo)renderAdmin();if(convoList.classList.contains('active'))renderConvoList()});

function send(){const text=input.value.trim();if(!text)return;input.value='';if(isAdmin){if(!currentConvo)return;socket.emit('msg',text,currentConvo)}else{socket.emit('msg',text);startThinking()}}
input.addEventListener('keypress',e=>{if(e.key==='Enter')send()});

let tapCount=0,tapTimer;adminToggle.addEventListener('click',()=>{tapCount++;clearTimeout(tapTimer);tapTimer=setTimeout(()=>tapCount=0,600);if(tapCount>=4){tapCount=0;adminLogin.classList.add('active')}});
adminBack.addEventListener('click',()=>adminLogin.classList.remove('active'));
adminSubmit.addEventListener('click',()=>{socket.emit('admin_auth',adminPass.value)});
adminPass.addEventListener('keypress',e=>{if(e.key==='Enter')adminSubmit.click()});

function renderConvoList(){convoItems.innerHTML='';let ids=Object.keys(conversations).sort((a,b)=>conversations[b].last-conversations[a].last);const q=filterQuery.trim().toLowerCase();if(q){ids=ids.filter(id=>{const c=conversations[id];const preview=c.preview||(c.msgs[c.msgs.length-1]?.text)||'';return id.toLowerCase().includes(q)||preview.toLowerCase().includes(q)})}if(ids.length===0){convoItems.innerHTML=`<div style=padding:40px;text-align:center;color:#555>${q?'no matches':'no messages yet'}</div>`;return}ids.forEach(id=>{const c=conversations[id];const div=document.createElement('div');div.className='convo-item';const preview=c.preview||(c.msgs[c.msgs.length-1]?.text)||'no messages';div.innerHTML=`<div style=display:flex;justify-content:space-between;align-items:center><strong>${id.slice(0,8)}</strong>${c.unread?`<span style=background:#666;color:#fff;font-size:0.65rem;padding:2px 8px;border-radius:10px>${c.unread}</span>`:''}</div><div class=preview>${escapeHtml(preview)}</div><div class=time>${c.last?fmtTime(c.last):''}</div>`;div.addEventListener('click',()=>{currentConvo=id;c.unread=0;convoList.classList.remove('active');renderAdmin();showToast(`switched to ${id.slice(0,8)}`)});convoItems.appendChild(div)})}
convoFilter.addEventListener('input',()=>{filterQuery=convoFilter.value;renderConvoList()});
closeConvo.addEventListener('click',()=>convoList.classList.remove('active'));

renderMine();(function(){if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const letters=Array.from(document.querySelectorAll('.title-word span, .footer-line span'));if(!letters.length)return;const variants=['gl1','gl2','gl3'];function fire(){const n=glitchIntense?(Math.random()<0.6?3:2):(Math.random()<0.25?2:1);const picked=new Set();while(picked.size<Math.min(n,letters.length))picked.add(letters[Math.floor(Math.random()*letters.length)]);picked.forEach(el=>{const v=variants[Math.floor(Math.random()*variants.length)];el.classList.remove('gl1','gl2','gl3');void el.offsetWidth;el.classList.add(v);el.addEventListener('animationend',()=>el.classList.remove(v),{once:true})});const gap=glitchIntense?(50+Math.random()*300):(180+Math.random()*1600);setTimeout(fire,gap)}setTimeout(fire,400+Math.random()*800)})()})();</script></body></html>
